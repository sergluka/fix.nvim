name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          version: 0.20.0
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .

      - name: luacheck
        uses: lunarmodules/luacheck@v1

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.1.5"

      - name: install deps
        run: luarocks install xml2lua

      - name: run busted
        uses: lunarmodules/busted@v0
